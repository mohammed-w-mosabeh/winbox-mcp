[project]
name = "winbox-mcp"
version = "0.1.0"
description = "MCP server to control MikroTik RouterOS devices (everything WinBox can do) via the RouterOS API, SSH and MNDP"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "paramiko>=3.4",
]

[project.scripts]
winbox-mcp = "winbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winbox_mcp"]
